name: Release (Production)

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '**/v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25.x
      - name: go mod tidy
        run: go mod tidy
      - name: go vet
        run: go vet ./...

  test:
    name: Test
    strategy:
      matrix:
        go-version:
          - 1.25.x
        platform:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25.x
      - name: go mod tidy
        run: go mod tidy
      - name: Run tests
        run: |
          go test ./... -coverprofile coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: 
      - test
      - lint
    env:
      CGO_ENABLED: 0
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25.x
      - name: go mod tidy
        run: go mod tidy
      - name: Debug secrets
        run: |
          echo "DOCKERHUB_USERNAME set: ${{ secrets.DOCKERHUB_USERNAME != '' }}"
          echo "DOCKERHUB_TOKEN set: ${{ secrets.DOCKERHUB_TOKEN != '' }}"
          echo "BOT_USERNAME set: ${{ secrets.BOT_USERNAME != '' }}"
          echo "BOT_GHCR_PAT set: ${{ secrets.BOT_GHCR_PAT != '' }}"
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - name: Build
        uses: goreleaser/goreleaser-action@7ec5c2b0c6cdda6e8bbb49444bc797dd33d74dd8 #v3
        with:
          version: v0.155.0
          args: --debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable experimental docker features
        run: |
          mkdir -p ~/.docker/ && \
          echo '{"experimental": "enabled"}' > ~/.docker/config.json
      - name: Create manifest for version
        run: |
          export DH_TAG=$(git tag --points-at HEAD | sed 's/^v*//')
          docker manifest create \
            thunderlotus/watchtower-continue:$DH_TAG \
            thunderlotus/watchtower-continue:amd64-$DH_TAG \
            thunderlotus/watchtower-continue:i386-$DH_TAG \
            thunderlotus/watchtower-continue:armhf-$DH_TAG \
            thunderlotus/watchtower-continue:arm64v8-$DH_TAG
          docker manifest create \
            ghcr.io/thunderlotus/watchtower-continue:$DH_TAG \
            ghcr.io/thunderlotus/watchtower-continue:amd64-$DH_TAG \
            ghcr.io/thunderlotus/watchtower-continue:i386-$DH_TAG \
            ghcr.io/thunderlotus/watchtower-continue:armhf-$DH_TAG \
            ghcr.io/thunderlotus/watchtower-continue:arm64v8-$DH_TAG
      - name: Annotate manifest for version
        run: |
          for REPO in '' ghcr.io/ ; do
          
          docker manifest annotate \
            ${REPO}thunderlotus/watchtower-continue:$(echo $TAG | sed 's/^v*//') \
            ${REPO}thunderlotus/watchtower-continue:i386-$(echo $TAG | sed 's/^v*//') \
            --os linux \
            --arch 386
          
          docker manifest annotate \
            ${REPO}thunderlotus/watchtower-continue:$(echo $TAG | sed 's/^v*//') \
            ${REPO}thunderlotus/watchtower-continue:armhf-$(echo $TAG | sed 's/^v*//') \
            --os linux \
            --arch arm
      
          docker manifest annotate \
            ${REPO}thunderlotus/watchtower-continue:$(echo $TAG | sed 's/^v*//') \
            ${REPO}thunderlotus/watchtower-continue:arm64v8-$(echo $TAG | sed 's/^v*//') \
            --os linux \
            --arch arm64 \
            --variant v8
            
            done
      - name: Create manifest for latest
        run: |
          docker manifest create \
            thunderlotus/watchtower-continue:latest \
            thunderlotus/watchtower-continue:amd64-latest \
            thunderlotus/watchtower-continue:i386-latest \
            thunderlotus/watchtower-continue:armhf-latest \
            thunderlotus/watchtower-continue:arm64v8-latest
          docker manifest create \
            ghcr.io/thunderlotus/watchtower-continue:latest \
            ghcr.io/thunderlotus/watchtower-continue:amd64-latest \
            ghcr.io/thunderlotus/watchtower-continue:i386-latest \
            ghcr.io/thunderlotus/watchtower-continue:armhf-latest \
            ghcr.io/thunderlotus/watchtower-continue:arm64v8-latest
      - name: Annotate manifest for latest
        run: |
          for REPO in '' ghcr.io/ ; do

          docker manifest annotate \
            ${REPO}thunderlotus/watchtower-continue:latest \
            ${REPO}thunderlotus/watchtower-continue:i386-latest \
            --os linux \
            --arch 386
      
          docker manifest annotate \
            ${REPO}thunderlotus/watchtower-continue:latest \
            ${REPO}thunderlotus/watchtower-continue:armhf-latest \
            --os linux \
            --arch arm
            
          docker manifest annotate \
            ${REPO}thunderlotus/watchtower-continue:latest \
            ${REPO}thunderlotus/watchtower-continue:arm64v8-latest \
            --os linux \
            --arch arm64 \
            --variant v8

          done
      - name: Push manifests to Dockerhub
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          docker login -u $DOCKER_USER -p $DOCKER_TOKEN && \
            docker manifest push thunderlotus/watchtower-continue:$(echo $TAG | sed 's/^v*//') && \
            docker manifest push thunderlotus/watchtower-continue:latest
      - name: Push manifests to GitHub Container Registry
        env:
          DOCKER_USER: ${{ github.actor }}
          DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker login -u $DOCKER_USER -p $DOCKER_TOKEN ghcr.io && \
            docker manifest push ghcr.io/thunderlotus/watchtower-continue:$(echo $TAG | sed 's/^v*//') && \
            docker manifest push ghcr.io/thunderlotus/watchtower-continue:latest


